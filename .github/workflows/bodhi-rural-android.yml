name: Bodhi Rural Android

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'public/branding/bodhi-rural-logo.png'
      - '.github/workflows/bodhi-rural-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'public/branding/bodhi-rural-logo.png'
      - '.github/workflows/bodhi-rural-android.yml'
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign the release bundle with the Play upload key
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -f "$sdk_root/platforms/android-36/android.jar" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
            test -n "$sdkmanager"
            "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36'
          fi
      - name: Build Android test and release artifacts
        working-directory: mobile/android
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bodhi-rural-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bodhi-rural-android-unsigned-release
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -f "$sdk_root/platforms/android-36/android.jar" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
            test -n "$sdkmanager"
            "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36'
          fi
      - name: Build signed Android App Bundle
        working-directory: mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Missing upload keystore}"
          : "${ANDROID_UPLOAD_STORE_PASSWORD:?Missing keystore password}"
          : "${ANDROID_UPLOAD_KEY_ALIAS:?Missing upload key alias}"
          : "${ANDROID_UPLOAD_KEY_PASSWORD:?Missing upload key password}"
          umask 077
          export ANDROID_UPLOAD_KEYSTORE_PATH="$(mktemp)"
          trap 'rm -f "$ANDROID_UPLOAD_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE_PATH"
          gradle :app:bundleRelease --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: bodhi-rural-android-signed-release
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
