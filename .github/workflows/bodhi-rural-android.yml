name: Bodhi Rural Android

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'public/branding/bodhi-rural-logo.png'
      - '.github/workflows/bodhi-rural-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'public/branding/bodhi-rural-logo.png'
      - '.github/workflows/bodhi-rural-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bodhi-rural-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
