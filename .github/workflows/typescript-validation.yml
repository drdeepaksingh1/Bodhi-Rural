name: Bodhi Rural validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public placeholders let Next.js prerender client components in CI.
      # No production credentials are required or stored in this workflow.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript compiler
        run: npx tsc --noEmit
      - name: Run lint
        run: npm run lint
      - name: Build production application
        run: npm run build
