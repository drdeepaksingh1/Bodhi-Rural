plugins {
    id 'com.android.application' version '8.13.0'
}

def uploadKeystore = providers.environmentVariable('ANDROID_UPLOAD_KEYSTORE_PATH')

android {
    namespace 'in.co.brlps.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'in.co.brlps.mobile'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    if (uploadKeystore.isPresent()) {
        signingConfigs {
            release {
                storeFile file(uploadKeystore.get())
                storePassword providers.environmentVariable('ANDROID_UPLOAD_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('ANDROID_UPLOAD_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('ANDROID_UPLOAD_KEY_PASSWORD').get()
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/brandAssets')
}

def syncBrand = tasks.register('syncBrand', Copy) {
    from(rootProject.file('../../public/branding')) {
        include 'bodhi-rural-logo.png'
    }
    into layout.buildDirectory.dir('generated/brandAssets')
}

tasks.named('preBuild') {
    dependsOn syncBrand
}
